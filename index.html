<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Pacman Mobile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Mini Pacman</h1>
      <p class="hint">Colete todos os pontos sem encostar no fantasma 👻</p>

      <section class="hud">
        <span>Pontos: <strong id="score">0</strong></span>
        <span>Vidas: <strong id="lives">3</strong></span>
      </section>

      <canvas id="game" width="320" height="320" aria-label="Jogo estilo pacman"></canvas>

      <section class="controls" aria-label="Controles">
        <button class="ctrl up" data-dir="up">⬆️</button>
        <button class="ctrl left" data-dir="left">⬅️</button>
        <button class="ctrl down" data-dir="down">⬇️</button>
        <button class="ctrl right" data-dir="right">➡️</button>
      </section>

      <button id="restart" class="restart">Recomeçar</button>
      <p id="status" class="status" role="status"></p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
